name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    name: Build, Test and E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Frontend
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sos_app/package-lock.json

      # Backend
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: mbstring, pdo, pdo_mysql, redis, sodium
          coverage: none

      - name: Install frontend dependencies
        working-directory: sos_app
        run: npm ci

      - name: Install backend dependencies
        working-directory: sos_api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment files
        run: |
          cp ./sos_api/.env.ci.example ./sos_api/.env
          cp ./mariadb.example.env ./mariadb.env
          sed -i "s|APP_KEY=.*|APP_KEY=$(php -r 'echo "base64:".base64_encode(random_bytes(32));')|" ./sos_api/.env

      - name: Start application
        working-directory: sos_api
        run: docker compose up -d --build

      - name: Wait for Laravel
        run: |
          timeout 180 bash -c '
          until curl -fs http://localhost:9003 > /dev/null; do
            echo "Waiting for Laravel..."
            sleep 5
          done
          '
      - name: Show container status
        if: failure()
        working-directory: sos_api
        run: |
          docker compose ps

      - name: Show app logs
        if: failure()
        working-directory: sos_api
        run: |
          docker compose logs app

      - name: Show Laravel log
        if: failure()
        working-directory: sos_api
        run: |
          docker compose exec -T app cat storage/logs/laravel.log || true

      - name: Show artisan error
        if: failure()
        working-directory: sos_api
        run: |
          docker compose exec -T app php artisan about || true

      - name: Run migrations
        working-directory: sos_api
        run: |
          docker compose exec -T app php artisan migrate --force

      - name: Frontend lint
        working-directory: sos_app
        run: npm run lint

      - name: Build Angular
        working-directory: sos_app
        run: npm run build

      - name: Install Cypress dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libgbm-dev libnotify-dev libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: sos_app
          install: false
          start: npm run start:ci
          wait-on: http://localhost:8100
          wait-on-timeout: 120

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v
