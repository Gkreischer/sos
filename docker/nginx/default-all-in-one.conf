# ============================================================
# Nginx Configuration for SOS All-in-One Container
# Single container: all services on localhost
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    client_max_body_size 100M;

    # =========================================================
    # Security Headers
    # =========================================================

    # HSTS:
    # Só habilite quando estiver usando HTTPS.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header Permissions-Policy "microphone=(), geolocation=(), payment=(), bluetooth=()" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' blob: https://viacep.com.br ws: wss:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;


    # =========================================================
    # Gzip
    # =========================================================

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;


    # =========================================================
    # Laravel API
    # =========================================================

    location ^~ /api/ {
        include fastcgi_params;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_PROXY "";

        fastcgi_read_timeout 300;
    }


    # =========================================================
    # Laravel Sanctum
    # =========================================================

    location ^~ /sanctum/ {
        include fastcgi_params;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_PROXY "";

        fastcgi_read_timeout 300;
    }


    # =========================================================
    # Laravel Broadcasting Authentication
    #
    # IMPORTANTE:
    # /broadcasting/auth é Laravel, NÃO Reverb.
    # =========================================================

    location ^~ /broadcasting/ {
        include fastcgi_params;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_PROXY "";

        fastcgi_read_timeout 300;
    }


    # =========================================================
    # Reverb WebSocket
    #
    # Pusher/Reverb usa /app/...
    # =========================================================

    location ^~ /app/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        proxy_buffering off;
    }


    # =========================================================
    # Laravel Storage
    # =========================================================

    location ^~ /storage/ {
        alias /var/www/html/public/storage/;
    }


    # =========================================================
    # Public Images
    # =========================================================

    location ^~ /images/ {
        alias /var/www/html/public/images/;
    }


    # =========================================================
    # Ticket Support
    # =========================================================

    location ^~ /ticket-support/ {
        try_files $uri $uri/ /ticket-support/index.html;
    }


    # =========================================================
    # Health Check
    # =========================================================

    location = /health {
        access_log off;

        default_type text/plain;

        return 200 "healthy\n";
    }


    # =========================================================
    # Frontend / Angular SPA
    # =========================================================

    location / {
        try_files $uri $uri/ /index.html;
    }


    # =========================================================
    # Static Assets
    # =========================================================

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;

        add_header Cache-Control "public, immutable";

        try_files $uri =404;
    }


    # =========================================================
    # Deny sensitive files
    # =========================================================

    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }
}
