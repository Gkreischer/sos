<ion-card>
  <ion-card-header>
    <ion-card-title>Filtros</ion-card-title>
    <ion-card-subtitle
      >Filtre os materiais pelo nome ou categoria</ion-card-subtitle
    >
  </ion-card-header>
  <ion-card-content>
    <form [formGroup]="filterForm">
      <ion-grid>
        <ion-row>
          <ion-col size="12" sizeLg="10">
            <ion-input
              label="Descrição"
              labelPlacement="floating"
              formControlName="description"
              fill="outline"
              (ionChange)="searchPost()"
            ></ion-input>
          </ion-col>
          <ion-col size="12" sizeLg="2">
            <ion-button
              class="full-button"
              expand="block"
              type="submit"
              [disabled]="filterForm.invalid"
              (click)="searchPost()"
              >Buscar</ion-button
            >
          </ion-col>
        </ion-row>
      </ion-grid>
    </form>
  </ion-card-content>
</ion-card>
