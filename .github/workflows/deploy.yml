name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version tag to deploy (e.g., v1.2.3 or latest)'
        required: false
        default: 'latest'

  release:
    types: [published]

permissions:
  contents: read
  packages: read
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository }}/sos-api
  IMAGE_FRONTEND: ${{ github.repository }}/sos-frontend

jobs:
  # ============================================
  # VALIDATE & PREPARE
  # ============================================

  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [[ "${{ inputs.version }}" != "latest" ]]; then
            VERSION="${{ inputs.version }}"
          else
            # Get latest tag
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "latest")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Verify images exist
        run: |
          echo "Checking API image: ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ steps.version.outputs.version }}"
          echo "Checking Frontend image: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ steps.version.outputs.version }}"

          # Verify images exist in registry
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ steps.version.outputs.version }} || exit 1
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ steps.version.outputs.version }} || exit 1

  # ============================================
  # DEPLOY STAGING
  # ============================================

  deploy-staging:
    name: Deploy to Staging
    needs: validate
    if: inputs.environment == 'staging' || github.event_name == 'release'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          script: |
            cd /opt/sos/staging
            
            # Update version in docker-compose or deploy script
            export API_VERSION=${{ needs.validate.outputs.version }}
            export FRONTEND_VERSION=${{ needs.validate.outputs.version }}
            
            # Pull latest images
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ needs.validate.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ needs.validate.outputs.version }}
            
            # Deploy with docker compose
            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d --remove-orphans
            
            # Wait for health checks
            sleep 30
            
            # Verify deployment
            curl -f http://localhost:9003/health || exit 1
            
            # Clean up old images
            docker image prune -f

      - name: Notify Staging Deployment
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Staging deployment ${{ job.status }}: version ${{ needs.validate.outputs.version }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # ============================================
  # DEPLOY PRODUCTION
  # ============================================

  deploy-production:
    name: Deploy to Production
    needs: validate
    if: inputs.environment == 'production'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT }}
          script: |
            cd /opt/sos/production
            
            # Backup current deployment
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            mkdir -p backups/$TIMESTAMP
            docker compose -f docker-compose.prod.yml config > backups/$TIMESTAMP/docker-compose.yml.bak
            
            # Update version
            export API_VERSION=${{ needs.validate.outputs.version }}
            export FRONTEND_VERSION=${{ needs.validate.outputs.version }}
            
            # Pull latest images
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ needs.validate.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ needs.validate.outputs.version }}
            
            # Deploy with zero-downtime strategy
            docker compose -f docker-compose.prod.yml pull
            
            # Rolling update for API (if multiple replicas)
            docker compose -f docker-compose.prod.yml up -d --no-deps --scale app=2 sos-api
            sleep 15
            docker compose -f docker-compose.prod.yml up -d --no-deps --scale app=1 sos-api
            
            # Update frontend
            docker compose -f docker-compose.prod.yml up -d --no-deps sos-frontend
            
            # Wait for health checks
            sleep 30
            
            # Verify deployment
            curl -f https://sos.example.com/health || exit 1
            curl -f https://sos.example.com/api/health || exit 1
            
            # Clean up
            docker image prune -f
            
            echo "Production deployment completed successfully!"

      - name: Create Deployment Record
        run: |
          # Create a deployment record (could be GitHub Deployment API, database, etc.)
          curl -X POST https://api.github.com/repos/${{ github.repository }}/deployments \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{"ref":"${{ github.sha }}","environment":"production","description":"Deploy version ${{ needs.validate.outputs.version }}","auto_merge":false,"required_contexts":[]}'

      - name: Notify Production Deployment
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Production deployment ${{ job.status }}: version ${{ needs.validate.outputs.version }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # ============================================
  # POST-DEPLOY SMOKE TESTS
  # ============================================

  smoke-tests:
    name: Post-Deploy Smoke Tests
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Run smoke tests against Staging
        if: needs.deploy-staging.result == 'success'
        run: |
          echo "Running smoke tests against staging..."
          STAGING_URL="${{ secrets.STAGING_URL }}"
          
          # Health checks
          curl -f "${STAGING_URL}/health" || exit 1
          curl -f "${STAGING_URL}/api/health" || exit 1
          
          # Check frontend loads
          curl -f "${STAGING_URL}" | grep -q "SOS" || exit 1
          
          echo "Staging smoke tests passed!"

      - name: Run smoke tests against Production
        if: needs.deploy-production.result == 'success'
        run: |
          echo "Running smoke tests against production..."
          PROD_URL="${{ secrets.PRODUCTION_URL }}"
          
          # Health checks
          curl -f "${PROD_URL}/health" || exit 1
          curl -f "${PROD_URL}/api/health" || exit 1
          
          # Check frontend loads
          curl -f "${PROD_URL}" | grep -q "SOS" || exit 1
          
          echo "Production smoke tests passed!"

  # ============================================
  # ROLLBACK (manual trigger on failure)
  # ============================================

  rollback:
    name: Rollback Deployment
    needs: [deploy-staging, deploy-production]
    if: failure() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Rollback Staging
        if: needs.deploy-staging.result == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          script: |
            cd /opt/sos/staging
            # Get previous working version from backup
            LATEST_BACKUP=$(ls -t backups/ | head -1)
            if [ -n "$LATEST_BACKUP" ]; then
              docker compose -f backups/$LATEST_BACKUP/docker-compose.yml.bak up -d
              echo "Rolled back to backup: $LATEST_BACKUP"
            else
              echo "No backup found for rollback"
            fi

      - name: Rollback Production
        if: needs.deploy-production.result == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT }}
          script: |
            cd /opt/sos/production
            # Get previous working version from backup
            LATEST_BACKUP=$(ls -t backups/ | head -1)
            if [ -n "$LATEST_BACKUP" ]; then
              docker compose -f backups/$LATEST_BACKUP/docker-compose.yml.bak up -d
              echo "Rolled back to backup: $LATEST_BACKUP"
            else
              echo "No backup found for rollback"
            fi

      - name: Notify Rollback
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          text: 'Rollback executed for failed deployment'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}