# ============================================================
# Nginx Configuration for SOS Production API
# Reverse proxy for Laravel API and Reverb WebSocket
# ============================================================

# Upstream for Laravel API (PHP-FPM)
upstream php_backend {
    server api:9000;
    keepalive 32;
}

# Upstream for Reverb WebSocket
upstream reverb_backend {
    server reverb:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /var/www/ionic/main;
    index index.html;

    client_max_body_size 100M;

    # =========================================================
    # Ticket Support
    # =========================================================

    location = /ticket-support {
        return 301 $scheme://$http_host/ticket-support/;
    }

    location ^~ /ticket-support/ {
        root /var/www/ionic;
        try_files $uri $uri/ /ticket-support/index.html;
    }

    # =========================================================
    # Main Ionic
    # =========================================================

    location / {
        root /var/www/ionic/main;
        try_files $uri $uri/ /index.html;
    }

    # =========================================================
    # Laravel API
    # =========================================================

    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass api:9000;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;

        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300;
    }

    # =========================================================
    # Sanctum
    # =========================================================

    location ^~ /sanctum/ {
        include fastcgi_params;
        fastcgi_pass api:9000;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;

        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300;
    }

    # =========================================================
    # Broadcasting
    # =========================================================

    location ^~ /broadcasting/ {
        include fastcgi_params;
        fastcgi_pass api:9000;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;

        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300;
    }

    # =========================================================
    # Reverb
    # =========================================================

    location ^~ /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # =========================================================
    # Laravel public files
    # =========================================================

    location ^~ /storage/ {
        alias /var/www/laravel-public/storage/;
    }

    location ^~ /images/ {
        alias /var/www/laravel-public/images/;
    }

    location = /health {
        default_type text/plain;
        return 200 "healthy\n";
    }
}