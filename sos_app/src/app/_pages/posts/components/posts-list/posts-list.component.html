<ion-card>
  <ion-card-header>
    <ion-card-title>Lista de posts</ion-card-title>
  </ion-card-header>
  <ion-card-content>
    @let posts = posts$ | async;
    <ion-list>
      @if (posts) {
        @for (p of posts; track p.id; let i = $index) {
          <ion-item button detail>
            <ion-label>
              <ion-text
                ><strong>{{ p.title }}</strong></ion-text
              >
              <p>{{ p.created_at | date: "dd/MM/yyyy" }}</p>
            </ion-label>
          </ion-item>
        } @empty {
          <ion-item>
            <ion-label>
              <h2>Nenhum post</h2>
              <p>Crie um post para ver aqui</p>
            </ion-label>
          </ion-item>
        }
      } @else {
        <ion-item>
          <ion-label>
            <h2>Erro ao carregar os posts</h2>
          </ion-label>
        </ion-item>
      }
    </ion-list>
  </ion-card-content>
</ion-card>
