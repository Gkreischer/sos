<ion-card>
  <ion-card-header>
    <ion-card-title>Quantidade de ordens por mês e ano</ion-card-title>
    <ion-card-subtitle
      >Aqui você pode obter dados inteligentes sobre a quantidade de ordens por
      mês e ano.</ion-card-subtitle
    >
  </ion-card-header>
  <ion-card-content>
    <div
      class="chart-container"
      style="position: relative; height: auto; width: 100%"
    >
      <canvas
        baseChart
        [data]="barChartData"
        [options]="barChartOptions"
        [type]="barChartType"
      >
      </canvas>
    </div>
  </ion-card-content>
</ion-card>
