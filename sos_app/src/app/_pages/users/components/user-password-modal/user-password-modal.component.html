<ion-header>
  <ion-toolbar>
    <ion-title>Alterar senha do usuário</ion-title>
    <ion-buttons slot="start">
      <ion-button shape="round" (click)="closeModal()" data-cy="close-modal">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
@let isLoading = isLoading$ | async;
<ion-content>
  <ion-card>
    <ion-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <ion-grid>
          <ion-row>
            <ion-col>
              <ion-input
                fill="outline"
                labelPlacement="floating"
                label="Senha"
                formControlName="password"
                placeholder="Senha"
                type="password"
              ></ion-input>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col>
              <ion-input
                fill="outline"
                labelPlacement="floating"
                label="Confirmar Senha"
                formControlName="password_confirmation"
                placeholder="Confirmar Senha"
                type="password"
              ></ion-input>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col>
              <ion-button
                type="submit"
                color="primary"
                expand="block"
                [disabled]="this.form.invalid || isLoading"
                >Alterar Senha</ion-button
              >
            </ion-col>
          </ion-row>
        </ion-grid>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
