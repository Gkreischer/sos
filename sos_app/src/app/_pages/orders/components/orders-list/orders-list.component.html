<ion-card>
  <ion-card-content>
    <ion-list>
      <ion-item lines="none" detail="true" button="true" *ngFor="let order of (orders$ | async) as orders" (click)="openModal(order)">
        <ion-label>
          <h3>{{ order.title }}</h3>
          <p>{{ order.user_id }}</p>
        </ion-label>
      </ion-item>
    </ion-list>
  </ion-card-content>
</ion-card>
