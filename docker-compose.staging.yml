# Staging Docker Compose for SOS Application
# This file is used by the deploy workflow for staging deployments

services:
  app:
    image: ghcr.io/${{ github.repository }}/sos-api:${API_VERSION:-latest}
    container_name: sos-api-staging
    restart: unless-stopped
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
      
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: sos_staging
      DB_USERNAME: sos
      DB_PASSWORD: ${STAGING_DB_PASSWORD}
      
      CACHE_DRIVER: redis
      FILESYSTEM_DISK: local
      QUEUE_CONNECTION: redis
      
      SESSION_DRIVER: redis
      SESSION_LIFETIME: 120
      
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${STAGING_REVERB_APP_ID}
      REVERB_APP_KEY: ${STAGING_REVERB_APP_KEY}
      REVERB_APP_SECRET: ${STAGING_REVERB_APP_SECRET}
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      LARAVEL_ENABLE_QUEUE_WORKER: "1"
      LARAVEL_ENABLE_SCHEDULER: "1"
      LARAVEL_ENABLE_REVERB: "1"
      
      # Sanctum / CORS
      SANCTUM_STATEFUL_DOMAINS: "staging.sos.example.com"
      SESSION_DOMAIN: ".staging.sos.example.com"
      
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - sos-staging

  nginx:
    image: ghcr.io/${{ github.repository }}/sos-frontend:${FRONTEND_VERSION:-latest}
    container_name: sos-frontend-staging
    restart: unless-stopped
    ports:
      - "9003:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - sos-staging

  pgsql:
    image: postgres:16-alpine
    container_name: sos-pgsql-staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: sos_staging
      POSTGRES_USER: sos
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD}
    volumes:
      - pgsql_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sos -d sos_staging"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - sos-staging

  redis:
    image: redis:7-alpine
    container_name: sos-redis-staging
    restart: unless-stopped
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sos-staging

volumes:
  pgsql_staging_data:
  redis_staging_data:

networks:
  sos-staging:
    driver: bridge