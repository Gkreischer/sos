# Production Docker Compose for SOS Application
# This file is used by the deploy workflow for production deployments

services:
  app:
    image: ghcr.io/${{ github.repository }}/sos-api:${API_VERSION:-latest}
    container_name: sos-api-prod
    restart: unless-stopped
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stack
      LOG_LEVEL: error
      
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: sos
      DB_USERNAME: sos
      DB_PASSWORD: ${PRODUCTION_DB_PASSWORD}
      
      CACHE_DRIVER: redis
      FILESYSTEM_DISK: local
      QUEUE_CONNECTION: redis
      
      SESSION_DRIVER: redis
      SESSION_LIFETIME: 120
      
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${PRODUCTION_REVERB_APP_ID}
      REVERB_APP_KEY: ${PRODUCTION_REVERB_APP_KEY}
      REVERB_APP_SECRET: ${PRODUCTION_REVERB_APP_SECRET}
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      LARAVEL_ENABLE_QUEUE_WORKER: "1"
      LARAVEL_ENABLE_SCHEDULER: "1"
      LARAVEL_ENABLE_REVERB: "1"
      
      # Sanctum / CORS
      SANCTUM_STATEFUL_DOMAINS: "sos.example.com,www.sos.example.com"
      SESSION_DOMAIN: ".sos.example.com"
      
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - sos-prod

  nginx:
    image: ghcr.io/${{ github.repository }}/sos-frontend:${FRONTEND_VERSION:-latest}
    container_name: sos-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - sos-prod

  pgsql:
    image: postgres:16-alpine
    container_name: sos-pgsql-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: sos
      POSTGRES_USER: sos
      POSTGRES_PASSWORD: ${PRODUCTION_DB_PASSWORD}
    volumes:
      - pgsql_prod_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sos -d sos"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - sos-prod

  redis:
    image: redis:7-alpine
    container_name: sos-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - sos-prod

volumes:
  pgsql_prod_data:
  redis_prod_data:

networks:
  sos-prod:
    driver: bridge
    name: sos-prod-network