<ion-card>
  <ion-card-header>
    <ion-card-title>Filtrar por status</ion-card-title>
  </ion-card-header>
  <ion-card-content>
    {{ form.value | json }}
    <form [formGroup]="form" (ngSubmit)="search()">
      <ion-grid>
        <ion-row>
          <ion-col size="12" sizeLg="3">
            <ion-select
              labelPlacement="floating"
              label="status"
              fill="outline"
              formControlName="status_id"
            >
              <ion-select-option value=""> Nenhum status </ion-select-option>
              <ion-select-option
                *ngFor="let status of ordersStatuses$ | async"
                [value]="status.id"
              >
                {{ status.name }}
              </ion-select-option>
            </ion-select>
          </ion-col>
          <ion-col size="12" sizeLg="7">
            <ion-input
              fill="outline"
              label="Pesquisar"
              labelPlacement="floating"
              formControlName="search"
            ></ion-input>
          </ion-col>
          <ion-col size="12" sizeLg="2">
            <ion-button
              [disabled]="!this.form.valid"
              type="submit"
              expand="block"
              color="primary"
              class="full-button"
            >
              Buscar
            </ion-button>
          </ion-col>
        </ion-row>
      </ion-grid>
    </form>
  </ion-card-content>
</ion-card>
