<ion-card>
  <ion-card-header>
    <ion-card-title>Filtros</ion-card-title>
    <ion-card-subtitle
      >Utilize os filtros abaixo para visualizar os dados de acordo com suas
      necessidades.</ion-card-subtitle
    >
  </ion-card-header>
  <ion-card-content>
    <form [formGroup]="form" (ngSubmit)="setDateFilter()">
      <ion-grid class="ion-padding">
        <ion-row>
          <ion-col size="12" sizeLg="2">
            <ion-input
              fill="outline"
              labelPlacement="floating"
              label="Início"
              formControlName="startDate"
              [maskito]="dateMask"
              [maskitoElement]="maskPredicate"
              inputmode="numeric"
              [clearOnEdit]="true"
              required
            ></ion-input>
          </ion-col>
          <ion-col size="12" sizeLg="2">
            <ion-input
              fill="outline"
              labelPlacement="floating"
              label="Fim"
              formControlName="endDate"
              [maskito]="dateMask"
              [maskitoElement]="maskPredicate"
              inputmode="numeric"
              [clearOnEdit]="true"
              required
            ></ion-input>
          </ion-col>
          <ion-col size="12" sizeLg="2">
            @let isLoading = isLoading$ | async;
            <ion-button
              expand="block"
              class="full-button"
              type="submit"
              [disabled]="form.invalid || isLoading"
            >
              <ion-icon name="search" slot="start"> </ion-icon
              >Procurar</ion-button
            >
          </ion-col>
        </ion-row>
      </ion-grid>
    </form>
  </ion-card-content>
</ion-card>
