<ion-header>
  <ion-toolbar>
    <ion-title *ngIf="!user">Adicionar Usuário</ion-title>
    <ion-title *ngIf="user">Editar Usuário</ion-title>
    <ion-buttons slot="start">
      <ion-button shape="round" (click)="closeModal()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-card-content>
      {{ userForm.value | json }}
      <form [formGroup]="userForm" (ngSubmit)="this.user ? update() : submit()">
        <ion-grid>
          <ion-row>
            <ion-col size="12" sizeLg="3">
              <ion-select
                fill="outline"
                labelPlacement="floating"
                label="Tipo"
                formControlName="type"
                placeholder="Tipo"
              >
                @for (category of categories | async; track $index) {
                  <ion-select-option [value]="category.id">{{
                    category.name
                  }}</ion-select-option>
                }
              </ion-select>
            </ion-col>
            <ion-col>
              <ion-input
                fill="outline"
                labelPlacement="floating"
                label="Nome"
                formControlName="name"
              ></ion-input>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col>
              <ion-input
                fill="outline"
                labelPlacement="floating"
                label="Email"
                formControlName="email"
                placeholder="Email"
              ></ion-input>
            </ion-col>
            <ion-col>
              <ion-input
                fill="outline"
                [maskito]="phoneOptions"
                [maskitoElement]="maskPredicate"
                labelPlacement="floating"
                label="Telefone"
                formControlName="phone"
                placeholder="Telefone"
              ></ion-input>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col>
              <ion-input
                fill="outline"
                labelPlacement="floating"
                label="Endereço"
                formControlName="address"
                placeholder="Endereço"
              ></ion-input>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col>
              <ion-input
                fill="outline"
                labelPlacement="floating"
                label="CPF"
                formControlName="cpf"
                placeholder="CPF"
              ></ion-input>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col>
              <ion-input
                fill="outline"
                labelPlacement="floating"
                label="CNPJ"
                formControlName="cnpj"
                placeholder="CNPJ"
              ></ion-input>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col size="12" sizeLg="3">
              <ion-input
                fill="outline"
                labelPlacement="floating"
                label="CEP"
                formControlName="cep"
                placeholder="CEP"
              ></ion-input>
            </ion-col>
            <ion-col>
              <ion-input
                fill="outline"
                labelPlacement="floating"
                label="Cidade"
                formControlName="city"
                placeholder="Cidade"
              ></ion-input>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col>
              <ion-input
                fill="outline"
                labelPlacement="floating"
                label="Estado"
                formControlName="state"
                placeholder="Estado"
              ></ion-input>
            </ion-col>
            <ion-col>
              <ion-input
                fill="outline"
                labelPlacement="floating"
                label="País"
                formControlName="country"
                placeholder="País"
              ></ion-input>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col>
              <ion-button
                *ngIf="user"
                type="submit"
                color="primary"
                expand="block"
                [disabled]="!this.userForm.valid"
                >Atualizar</ion-button
              >
              <ion-button
                *ngIf="!user"
                type="submit"
                color="primary"
                expand="block"
                [disabled]="!this.userForm.valid"
                >Cadastrar</ion-button
              >
            </ion-col>
          </ion-row>
        </ion-grid>
      </form>
    </ion-card-content>
  </ion-card>
  <ion-fab *ngIf="user" slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button color="danger" (click)="confirmDeleteUser()">
      <ion-icon name="trash"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
