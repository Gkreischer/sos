name: sos

services:
  app:
    build:
      context: .
      dockerfile: docker/laravel/Dockerfile

    image: sos-api:latest

    container_name: sos-backend

    restart: unless-stopped

    environment:
        LARAVEL_ENABLE_QUEUE_WORKER: 1
        LARAVEL_ENABLE_SCHEDULER: 1
        LARAVEL_ENABLE_REVERB: 1

    depends_on:
      pgsql:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - sos

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile

    image: sos-frontend:latest
    container_name: sos-nginx
    restart: unless-stopped

    ports:
      - "9003:80"

    depends_on:
      app:
        condition: service_healthy

    networks:
      - sos

  pgsql:
    image: docker.io/library/postgres:18.4-alpine
    container_name: sos-pgsql
    restart: unless-stopped

    env_file:
      - pgsql.env

    volumes:
      - pgsql_data:/var/lib/postgresql/18/docker

    healthcheck:
        test: ["CMD-SHELL", "pg_isready"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 10s

    networks:
      - sos

  redis:
    image: docker.io/library/redis:latest
    container_name: sos-redis
    restart: unless-stopped

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - sos
      
volumes:
  pgsql_data:
  redis_data:

networks:
  sos:
    driver: bridge
