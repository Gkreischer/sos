name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  frontend:
    name: Frontend Ionic Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sos_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sos_app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build Angular
        run: npm run build

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: sos_app
          install: false
          command: npm run cypress:run

  backend:
    name: Backend Laravel
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sos_api

    services:
      mysql:
        image: mariadb:latest

        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: laravel
          MARIADB_USER: laravel
          MARIADB_PASSWORD: secret

        ports:
          - 3306:3306

        options: >-
          --health-cmd="healthcheck.sh --connect"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:latest

        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: mbstring, pdo, pdo_mysql, redis
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel
          DB_USERNAME: laravel
          DB_PASSWORD: secret

      - name: Run tests
        run: php artisan test
