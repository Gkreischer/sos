<div class="ion-page">
  <ion-toolbar>
    <ion-buttons slot="end"> </ion-buttons>
  </ion-toolbar>
  <ion-backdrop [visible]="true"></ion-backdrop>
</div>
<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-button (click)="closeModal()">
          <ion-icon name="close"></ion-icon>
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
<div id="box">
  <ion-img [src]="imageUrl"></ion-img>
</div>
