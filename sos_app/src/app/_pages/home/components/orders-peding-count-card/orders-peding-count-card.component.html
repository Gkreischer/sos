<ion-card color="danger">
  <ion-card-content>
    @if (count() === null) {
      <ion-skeleton-text animated style="width: 100%"></ion-skeleton-text>
    } @else {
      <ion-list>
        <ion-item lines="none" color="danger" size="small">
          <ion-icon class="ion-no-margin" name="flame" slot="start"></ion-icon>

          <ion-label>
            <h1>
              <ion-text color="light">{{ count() }}</ion-text>
            </h1>
          </ion-label>
        </ion-item>
      </ion-list>
      <strong>Ordens com status pendente</strong>
    }
  </ion-card-content>
</ion-card>
