<ion-card>
  <ion-card-header>
    <ion-card-title>Receita por status</ion-card-title>
    <ion-card-subtitle
      >Aqui você pode obter dados inteligentes sobre a receita total por status
      de ordens de serviço.</ion-card-subtitle
    >
  </ion-card-header>
  <ion-card-content>
    <ion-grid>
      <ion-row>
        @for (status of totalPriceByStatus$(); track status.name) {
          <ion-col>
            <ion-text
              [color]="
                status.name === 'Pendente'
                  ? 'danger'
                  : status.name === 'Em andamento'
                    ? 'warning'
                    : status.name === 'Finalizado'
                      ? 'success'
                      : status.name === 'Cancelado'
                        ? 'medium'
                        : 'primary'
              "
            >
              <strong>{{ status.name }}</strong>
            </ion-text>
            <p>{{ status.revenue | currency: "BRL" }}</p>
          </ion-col>
        } @empty {
          <ion-text>Nenhuma informação encontrada</ion-text>
        }
      </ion-row>
      <ion-row>
        <ion-col>
          <div
            class="chart-container"
            style="position: relative; height: auto; width: 100%"
          >
            <canvas
              baseChart
              [data]="polarAreaChartData"
              [legend]="polarAreaLegend"
              [type]="polarAreaChartType"
            >
            </canvas>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card-content>
</ion-card>
