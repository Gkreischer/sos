<ion-card>
  <ion-card-header>
    <ion-card-title>Login</ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <ion-grid>
        <ion-row>
          <ion-col>
            <ion-input
              fill="outline"
              label="Email"
              formControlName="email"
              labelPlacement="floating"
              autocomplete="true"
            ></ion-input>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <ion-input
              fill="outline"
              label="Senha"
              formControlName="password"
              labelPlacement="floating"
              autocomplete="true"
              type="password"
            ></ion-input>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <ion-button
              expand="block"
              type="submit"
              [disabled]="loginForm.invalid"
            >
              Entrar
            </ion-button>
          </ion-col>
        </ion-row>
      </ion-grid>
    </form>
  </ion-card-content>
</ion-card>
