name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    name: Build, Test and E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Frontend
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sos_app/package-lock.json

      # Backend
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: mbstring, pdo, pdo_mysql, redis
          coverage: none

      - name: Install frontend dependencies
        working-directory: sos_app
        run: npm ci

      - name: Install backend dependencies
        working-directory: sos_api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment files
        working-directory: sos_api
        run: |
          cp production.env.example production.env
          cp mariadb.example.env mariadb.env

      - name: Start application
        working-directory: sos_api
        run: docker compose up -d --build

      - name: Wait for Laravel
        run: |
          timeout 180 bash -c '
          until curl -fs http://localhost:9003 > /dev/null; do
            echo "Waiting for Laravel..."
            sleep 5
          done
          '

      - name: Run migrations
        working-directory: sos_api
        run: |
          docker compose exec -T app php artisan migrate --force

      - name: Frontend lint
        working-directory: sos_app
        run: npm run lint

      - name: Build Angular
        working-directory: sos_app
        run: npm run build

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: sos_app
          install: false
          start: npm start
          wait-on: http://localhost:8100
          wait-on-timeout: 120

      - name: Run Laravel tests
        working-directory: sos_api
        run: |
          docker compose exec -T app php artisan test

      - name: Show container logs
        if: failure()
        working-directory: sos_api
        run: docker compose logs

      - name: Stop containers
        if: always()
        working-directory: sos_api
        run: docker compose down -v
