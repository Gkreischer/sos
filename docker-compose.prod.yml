# Production Docker Compose for SOS Application
# This file is used by the deploy workflow for production deployments

services:
  backend:
    image: docker.io/gustavokreischer/sos-backend:latest
    container_name: sos-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stack
      LOG_LEVEL: error

      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: sos
      DB_USERNAME: sos
      DB_PASSWORD: 8jPV9RnEPJWjRaEX

      CACHE_DRIVER: redis
      FILESYSTEM_DISK: local
      QUEUE_CONNECTION: redis

      SESSION_DRIVER: redis
      SESSION_LIFETIME: 120

      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: 7402573693556011
      REVERB_APP_KEY: 7710384340660512
      REVERB_APP_SECRET: sTVk8HJE4VXAV2hM
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: 8080
      REVERB_SCHEME: http

      REDIS_HOST: redis
      REDIS_PORT: 6379

      LARAVEL_ENABLE_QUEUE_WORKER: "1"
      LARAVEL_ENABLE_SCHEDULER: "1"
      LARAVEL_ENABLE_REVERB: "1"

      # Sanctum / CORS
      SANCTUM_STATEFUL_DOMAINS: "ordermservico.dpdns.org"
      SESSION_DOMAIN: ".ordermservico.dpdns.org"

    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - sos-prod

  frontend:
    image: docker.io/gustavokreischer/sos-frontend:latest
    container_name: sos-frontend
    restart: unless-stopped
    ports:
      - "9003:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sos-prod

  pgsql:
    image: postgres:18-alpine
    container_name: sos-pgsql
    restart: unless-stopped
    environment:
      POSTGRES_DB: sos
      POSTGRES_USER: sos
      POSTGRES_PASSWORD: 8jPV9RnEPJWjRaEX
    volumes:
      - pgsql_prod_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sos -d sos"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - sos-prod

  redis:
    image: redis:7-alpine
    container_name: sos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sos-prod

volumes:
  pgsql_prod_data:
  redis_prod_data:

networks:
  sos-prod:
    driver: bridge
    name: sos-prod-network
