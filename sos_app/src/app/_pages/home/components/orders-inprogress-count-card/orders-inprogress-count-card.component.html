<ion-card color="warning">
  <ion-card-content>
    @if (count() === null) {
      <ion-skeleton-text animated style="width: 100%"></ion-skeleton-text>
    } @else {
      <ion-list>
        <ion-item lines="none" color="warning">
          <ion-icon
            class="ion-no-margin"
            name="hourglass"
            slot="start"
          ></ion-icon>

          <ion-label>
            <h1 color="light">{{ count() }}</h1>
          </ion-label>
        </ion-item>
      </ion-list>
      <strong>Ordens com status em andamento</strong>
    }
  </ion-card-content>
</ion-card>
