<ion-content color="light">
  <ion-card *ngIf="users | async as users">
    <ion-card-content>
      <ion-list *ngIf="users.length > 0">
        <ion-item
          button="true"
          detail="true"
          *ngFor="let user of users"
          (click)="openModal(user)"
        >
          <ion-label>
            <h3>{{ user.name }}</h3>
            <p>{{ user.phone | formatPhone }}</p>
          </ion-label>
        </ion-item>
      </ion-list>
      <p *ngIf="users.length == 0">Nenhum usuário encontrado</p>
    </ion-card-content>
  </ion-card>
</ion-content>
