name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  # ============================================
  # FRONTEND JOBS (Angular/Ionic)
  # ============================================

  frontend-lint:
    name: Frontend - Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sos_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sos_app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  frontend-test:
    name: Frontend - Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sos_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sos_app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for testing
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          echo "CHROME_BIN=/usr/bin/chromium-browser" >> $GITHUB_ENV

      - name: Run unit tests
        run: npm run test -- --code-coverage --watch=false
        env:
          CI: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always() && github.actor != 'nektos/act'
        with:
          flags: frontend
          files: ./sos_app/coverage/sos/lcov.info
          fail_ci_if_error: false

  frontend-build:
    name: Frontend - Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    defaults:
      run:
        working-directory: sos_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sos_app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build:all

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            sos_app/www/browser
            sos_app/dist/ticket-support/browser
          retention-days: 7

  frontend-e2e:
    name: Frontend - E2E Tests (Cypress)
    runs-on: ubuntu-latest
    needs: frontend-build
    defaults:
      run:
        working-directory: sos_app
    if: github.actor != 'nektos/act'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sos_app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Cypress system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libgbm-dev libnotify-dev libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb

      - name: Build frontend for E2E
        run: npm run build:all

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: sos_app
          install: false
          start: npm run start:ci
          wait-on: http://localhost:8100
          wait-on-timeout: 120
          browser: chrome

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: sos_app/cypress/screenshots
          retention-days: 7

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: sos_app/cypress/videos
          retention-days: 7

  # ============================================
  # SUMMARY
  # ============================================

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test, frontend-build, frontend-e2e]
    if: always() && github.actor != 'nektos/act'
    steps:
      - name: Check job statuses
        run: |
          echo "Frontend Lint: ${{ needs.frontend-lint.result }}"
          echo "Frontend Test: ${{ needs.frontend-test.result }}"
          echo "Frontend Build: ${{ needs.frontend-build.result }}"
          echo "Frontend E2E: ${{ needs.frontend-e2e.result }}"

          # Fail if any required job failed
          if [[ "${{ needs.frontend-lint.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-test.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-build.result }}" != "success" ]]; then
            exit 1
          fi

      - name: Success message
        if: success()
        run: echo "✅ All CI checks passed!"

      - name: Failure message
        if: failure()
        run: echo "❌ Some CI checks failed!"
