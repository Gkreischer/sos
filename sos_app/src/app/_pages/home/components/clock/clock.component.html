<ion-card>
  <ion-card-header>
    <ion-card-title>Relógio</ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <ion-grid>
      <ion-row>
        <ion-col size="12">
          <ion-label>
            <ion-icon size="large" name="time" color="dark"></ion-icon>
            <ion-text color="dark">
              {{ time }}
            </ion-text>
          </ion-label>
        </ion-col>
        <ion-col size="12">
          <ion-label>
            <ion-icon size="large" name="calendar" color="dark"></ion-icon>
            <ion-text color="dark">
              {{ date }}
            </ion-text>
          </ion-label>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card-content>
</ion-card>
