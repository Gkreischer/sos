<ion-header>
  <ion-toolbar>
    <ion-title>Categorias</ion-title>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content color="light">
  <ion-card *ngIf="categories | async as categories">
    <ion-card-content>
      <ion-list lines="none">
        <ion-item
          button="true"
          detail="true"
          *ngFor="let category of categories"
          (click)="openModal(category)"
        >
          <ion-label>{{ category.name }}</ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
