<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Relatórios</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <app-metric-filter></app-metric-filter>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Métricas</ion-card-title>
      <ion-card-subtitle
        >Aqui você pode obter dados inteligentes sobre as ordens de serviço e
        etc.</ion-card-subtitle
      >
    </ion-card-header>
    <ion-card-content>
      <ion-grid>
        <ion-row>
          <ion-col> </ion-col>
        </ion-row>
        <ion-row>
          <ion-col size="12" sizeXl="4">
            <app-bar-chart-counter></app-bar-chart-counter>
          </ion-col>
          <ion-col size="12" sizeXl="4">
            <app-pie-order-by-status-between-periods></app-pie-order-by-status-between-periods>
          </ion-col>
          <ion-col size="12" sizeXl="4">
            <app-line-chart-total-price-between-periods></app-line-chart-total-price-between-periods>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col size="12" sizeXl="4">
            <app-revenue-values-list></app-revenue-values-list>
          </ion-col>
          <ion-col size="12" sizeXl="4">
            <app-technician-data-list></app-technician-data-list>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card-content>
  </ion-card>
</ion-content>
