<ion-card>
  <ion-card-header>
    <ion-card-title>Dados dos Técnicos</ion-card-title>
    <ion-card-subtitle
      >Listagem da quantidade de OS feitas por cada Técnico no periodo
      informado</ion-card-subtitle
    >
    <ion-card-content>
      @for (user of technicianOrderMetrics$(); track user.id) {
        <ion-list>
          <ion-item>
            <ion-label>
              <h2>{{ user.name }}</h2>
              <ion-note>{{ user.total_orders }} ordens</ion-note>
              <br />
              <ion-note>{{ user.total_revenue | currency: "BRL" }}</ion-note>
            </ion-label>
          </ion-item>
        </ion-list>
      } @empty {
        <ion-text>Nenhuma informação encontrada</ion-text>
      }
    </ion-card-content>
  </ion-card-header>
</ion-card>
