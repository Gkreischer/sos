@if (orders$ | async; as orders) {
  <ion-card>
    <ion-card-header>
      <ion-card-title>Ordens de Serviço</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        @if (orders.length > 0) {
          <ion-item
            lines="inset"
            detail="true"
            button="true"
            *ngFor="let order of orders; trackBy: trackById"
            (click)="openModal(order)"
          >
            <div class="ion-margin-horizontal">
              <h1>{{ order.id }}</h1>
            </div>
            <ion-label class="ion-padding-start">
              <h2 class="ion-text-bold">{{ order.title }}</h2>
              <ion-chip color="primary">{{ order.user.name }}</ion-chip>

              <ion-chip color="dark">{{ order.equipment.name }}</ion-chip>
              <ion-chip>{{ order.created_at | date: "short" }}</ion-chip>
              <ion-chip
                [color]="
                  order.status_id == 1
                    ? 'danger'
                    : order.status_id == 2
                      ? 'warning'
                      : order.status_id == 3
                        ? 'success'
                        : order.status_id == 4
                          ? 'dark'
                          : 'light'
                "
                >{{ order.status.name }}</ion-chip
              >
            </ion-label>
          </ion-item>
        } @else {
          <ion-item lines="none">Nenhuma ordem encontrada</ion-item>
        }
      </ion-list>
    </ion-card-content>
  </ion-card>
}
