<ion-card>
  <ion-card-header>
    <ion-card-title>Clientes com maior receita</ion-card-title>
    <ion-card-subtitle
      >Listagem de clientes que mais gastaram na sua empresa</ion-card-subtitle
    >
    <ion-card-content class="ion-no-padding">
      <ion-list>
        @for (user of customerRevenueList$(); track user.id) {
          <ion-item>
            <ion-label>
              <p>
                <strong
                  ><ion-text color="dark">{{ user.name }}</ion-text></strong
                >
              </p>
              <ion-note>{{ user.total_orders }} ordens</ion-note>
              <br />
              <ion-note>{{ user.total_revenue | currency: "BRL" }}</ion-note>
            </ion-label>
          </ion-item>
        } @empty {
          <ion-item lines="none">
            <ion-label>
              <p><ion-text color="dark">Nenhum usuário encontrado</ion-text></p>
            </ion-label>
          </ion-item>
        }
      </ion-list>
    </ion-card-content>
  </ion-card-header>
</ion-card>
