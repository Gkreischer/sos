<ion-card>
  <ion-card-header>
    <ion-card-title>Quantidade de OS por status</ion-card-title>
    <ion-card-subtitle
      >Aqui você pode obter dados inteligentes sobre a quantidade total por
      status de ordens de serviço.</ion-card-subtitle
    >
  </ion-card-header>
  <ion-card-content>
    <div
      class="chart-container"
      style="position: relative; height: auto; width: 100%"
    >
      <canvas
        baseChart
        [data]="pieChartData"
        [type]="pieChartType"
        [options]="pieChartOptions"
        [plugins]="pieChartPlugins"
      >
      </canvas>
    </div>
  </ion-card-content>
</ion-card>
