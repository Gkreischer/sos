services:
  # ============================================================
  # Laravel API
  # ============================================================

  api:
    build:
      context: ..
      dockerfile: sos_api/docker/Dockerfile

    container_name: sos-api

    restart: unless-stopped

    volumes:
      - api-storage:/var/www/html/storage
      - api-bootstrap-cache:/var/www/html/bootstrap/cache

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - sos-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost/api/health || curl -f http://localhost/health",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  redis:
    image: docker.io/redis:alpine
    container_name: sos-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

    networks:
      - sos-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # PostgreSQL
  # ============================================================

  postgres:
    image: docker.io/postgres:18.4-alpine

    container_name: sos-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: sos
      POSTGRES_DB: sos
      POSTGRES_PASSWORD: sos

    volumes:
      - postgres_data:/var/lib/postgresql/18/main

    networks:
      - sos-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sos"]

      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10

  # ============================================================
  # Frontend
  # ============================================================

  frontend:
    build:
      context: ..
      dockerfile: prod/Dockerfile.frontend

    container_name: sos-frontend

    volumes:
      - frontend:/output

    networks:
      - sos-network

  # ============================================================
  # Nginx
  # ============================================================

  nginx:
    image: docker.io/nginx:alpine

    container_name: sos-nginx

    restart: unless-stopped

    ports:
      - "9003:80"

    volumes:
      - frontend:/usr/share/nginx/html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro,Z

    depends_on:
      api:
        condition: service_started

      frontend:
        condition: service_completed_successfully

    networks:
      - sos-network

# ============================================================
# Volumes
# ============================================================

volumes:
  postgres_data:
  redis_data:
  api-storage:
  api-bootstrap-cache:
  frontend:

# ============================================================
# Network
# ============================================================

networks:
  sos-network:
    driver: bridge
