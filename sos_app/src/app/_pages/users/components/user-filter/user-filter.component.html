<ion-card>
  <ion-card-header>
    <ion-card-title>Filtros</ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <form [formGroup]="filterForm">
      <ion-grid>
        <ion-row>
          <ion-col size="12" sizeLg="10">
            <ion-input
              label="Nome"
              labelPlacement="floating"
              formControlName="description"
              fill="outline"
            ></ion-input>
          </ion-col>
          <ion-col size="12" sizeLg="2">
            <ion-button
              class="full-button"
              expand="block"
              type="submit"
              [disabled]="!filterForm.valid"
              (click)="searchUser()"
              >Buscar</ion-button
            >
          </ion-col>
        </ion-row>
      </ion-grid>
    </form>
  </ion-card-content>
</ion-card>
