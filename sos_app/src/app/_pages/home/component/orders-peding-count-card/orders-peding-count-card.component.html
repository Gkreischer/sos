<ion-card color="danger">
  <ion-card-header>
    <ion-card-title>Qtd. de ordens pendentes</ion-card-title>
    <ion-card-subtitle>Ordens com status pendente</ion-card-subtitle>
  </ion-card-header>
  <ion-card-content>
    @if (count() === null) {
      <ion-skeleton-text animated style="width: 100%"></ion-skeleton-text>
    } @else {
      <ion-text color="light">
        <h1 color="light">{{ count() }}</h1>
      </ion-text>
    }
  </ion-card-content>
</ion-card>
